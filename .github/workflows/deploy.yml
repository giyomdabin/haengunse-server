name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Java 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 권한 설정
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. JAR 파일 빌드
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5. 필요한 파일만 EC2로 전송
      - name: Copy necessary files to EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar,Dockerfile,docker-compose.yml"
          target: "/home/ubuntu/haengunse-server"

      # 6. EC2에서 Docker Compose 실행
      - name: SSH and Restart Docker
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/haengunse-server
            
            # JAR 파일을 app.jar로 이름 변경 (경로 수정)
            if [ -f build/libs/*.jar ]; then
              mv build/libs/*.jar ./app.jar
            else
              echo "JAR file not found in build/libs/"
              exit 1
            fi
            
            # .env 파일 존재 확인
            if [ ! -f .env ]; then
              echo "Error: .env file not found!"
              exit 1
            fi
            
            # Docker Compose로 재시작
            docker-compose down
            docker-compose up -d --build
            
            # 컨테이너 상태 확인
            docker ps