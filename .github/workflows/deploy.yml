name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Java 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 권한 설정
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. JAR 파일 빌드
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5. 필요한 파일만 EC2로 전송
      - name: Copy necessary files to EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/app.jar,Dockerfile,docker-compose.yml"
          target: "/home/ubuntu/haengunse-server"

      # 6. EC2에서 Docker Compose 실행
      - name: SSH and Restart Docker
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: OPENAI_API_KEY,OPENAI_MODEL,KASI_API_KEY,CORS_ALLOWED_ORIGINS
          script: |
            cd /home/ubuntu/haengunse-server
            
            # .env 파일 생성
            cat > .env <<EOF
            OPENAI_API_KEY=$OPENAI_API_KEY
            OPENAI_MODEL=$OPENAI_MODEL
            KASI_API_KEY=$KASI_API_KEY
            CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS
            EOF
            
            echo "Checking for JAR files..."
            ls -la build/libs/ || true
            
            JAR_FILE=$(find build/libs/ -name "*.jar" ! -name "*-plain.jar" | head -1)
            if [ -n "$JAR_FILE" ]; then
              echo "Found JAR file: $JAR_FILE"
              mv "$JAR_FILE" ./app.jar
            else
              echo "JAR file not found in build/libs/"
              exit 1
            fi
            echo "Restarting Docker Compose..."
            docker-compose down
            docker-compose up -d --build
            echo "Docker container status:"
            docker ps