name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Java 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 권한 설정
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. JAR 파일 빌드
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5. 필요한 파일만 EC2로 전송
      - name: Copy necessary files to EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar,Dockerfile,docker-compose.yml"
          target: "/home/ubuntu/haengunse-server"

      # 6. EC2에서 Docker Compose 실행
      - name: SSH and Restart Docker
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/haengunse-server
            
            # JAR 파일 확인 및 이동
            echo "Checking for JAR files..."
            ls -la build/libs/
            
            JAR_FILE=$(find build/libs/ -name "*.jar" ! -name "*-plain.jar" | head -1)
            
            if [ -n "$JAR_FILE" ]; then
              echo "Found JAR file: $JAR_FILE"
              mv "$JAR_FILE" ./app.jar
            else
              echo "JAR file not found in build/libs/"
              exit 1
            fi
            
            # .env 파일 삭제 (더 이상 사용하지 않음)
            rm -f .env
            
            # GitHub Secrets를 환경변수로 설정
            export DB_URL="${{ secrets.DB_URL }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
            export OPENAI_MODEL="${{ secrets.OPENAI_MODEL }}"
            export KASI_API_KEY="${{ secrets.KASI_API_KEY }}"
            export CORS_ALLOWED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}"
            
            # Docker Compose로 재시작
            docker-compose down
            docker-compose up -d --build
            
            # 컨테이너 상태 확인
            docker ps