version: '3.8'

services:
  app:
    container_name: haengunse-app
    image: haengunse-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MINDLOGIC_BASE_URL=${MINDLOGIC_BASE_URL}
      - MINDLOGIC_API_KEY=${MINDLOGIC_API_KEY}
      - MINDLOGIC_MODEL=${MINDLOGIC_MODEL}
      - KASI_API_KEY=${KASI_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    restart: always
