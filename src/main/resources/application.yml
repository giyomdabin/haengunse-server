spring:
    application:
        name: haengunse-server

    config:
        import: swagger-config.yml, application-dev.yml

    ai:
        openai:
            api-key: ${OPENAI_API_KEY}
            chat:
                options:
                    model: ${OPENAI_MODEL}

kasi:
    api-key: ${KASI_API_KEY}

cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
    port: 8080
    servlet:
        context-path: /
        encoding:
            charset: UTF-8
            enabled: true
            force: true