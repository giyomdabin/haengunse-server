spring:
    application:
        name: haengunse-server

    config:
        import: swagger-config.yml

mindlogic:
    base-url: ${MINDLOGIC_BASE_URL}
    api-key: ${MINDLOGIC_API_KEY}
    model: ${MINDLOGIC_MODEL}

kasi:
    api-key: ${KASI_API_KEY}

cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
    port: 8080
    servlet:
        context-path: /
        encoding:
            charset: UTF-8
            enabled: true
            force: true
