spring:
    application:
        name: haengunse-server

    config:
        import: application-dev.yml, swagger-config.yml

    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

        jpa:
            hibernate:
                ddl-auto: create
                naming:
                    physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
            show-sql: true
            properties:
                hibernate:
                    dialect: org.hibernate.dialect.MySQL8Dialect
            open-in-view: false

        ai:
            openai:
                api-key: ${OPENAI_API_KEY}
                chat:
                    options:
                        model: ${OPENAI_MODEL}

    kasi:
        api-key: ${KASI_API_KEY}

server:
    port: 8080
    servlet:
        context-path: /
        encoding:
            charset: UTF-8
            enabled: true
            force: true